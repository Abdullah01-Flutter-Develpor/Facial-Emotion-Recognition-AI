name: demo_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^8.2.1
  animate_do: ^5.1.0
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  smooth_page_indicator: ^2.0.1
  lottie: ^3.5.1
  flutter_animate: ^4.5.2
  image_picker: ^1.2.3
  google_mlkit_face_detection: ^0.14.0
  image: ^4.9.2
  shared_preferences: ^2.5.4
  firebase_core: ^4.14.0
  firebase_auth: ^6.7.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  http: ^1.6.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  flutter_onnxruntime: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/emosense_launcher_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/emotion_model.onnx

    - assets/animation/
    - assets/branding/
